<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

    <main class="container">
        <!-- Game Area Panel -->
        <section class="glass-panel game-area">
            <header class="header">
                <h1>Agent Arena</h1>
                <div class="status" id="connection-status">
                    <span class="status-dot" id="status-dot"></span>
                    <span id="status-text">Disconnected</span>
                    <span id="match-display"></span>
                </div>
            </header>

            <!-- 3x3 Board Grid -->
            <div class="board" id="board">
                <div class="cell" id="cell-0" data-index="0"></div>
                <div class="cell" id="cell-1" data-index="1"></div>
                <div class="cell" id="cell-2" data-index="2"></div>
                <div class="cell" id="cell-3" data-index="3"></div>
                <div class="cell" id="cell-4" data-index="4"></div>
                <div class="cell" id="cell-5" data-index="5"></div>
                <div class="cell" id="cell-6" data-index="6"></div>
                <div class="cell" id="cell-7" data-index="7"></div>
                <div class="cell" id="cell-8" data-index="8"></div>
            </div>
            
            <!-- Player cards area -->
            <div class="players">
                 <div class="player-card" id="card-x">
                    <span style="color: var(--accent-primary); font-weight: bold; font-size: 1.2rem;">X</span>
                    <span id="label-x">Player X (Human)</span>
                 </div>
                 <div class="player-card" id="card-o">
                    <span style="color: var(--agent-color); font-weight: bold; font-size: 1.2rem;">O</span>
                    <span id="label-o">Player O (Agent)</span>
                 </div>
            </div>
        </section>

        <!-- Chat Area Panel -->
        <section class="glass-panel chat-area">
            <header class="chat-header">
                <h2>Match Chat</h2>
            </header>
            
            <div class="messages" id="chat-messages">
                <div class="message system">
                    Match initialized. Waiting for connections...
                </div>
            </div>

            <footer class="chat-input">
                <input type="text" id="chat-input" placeholder="Message the room..." disabled>
                <button id="chat-send" disabled>Send</button>
            </footer>
        </section>
    </main>

</body>
</html>
