<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Arena - Tic-Tac-Toe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Background Decorators -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="app-container">
        
        <!-- Header -->
        <header class="glass-panel main-header">
            <div class="header-left">
                <h1>Agent Arena</h1>
                <div class="connection-status">
                    <span id="connection-dot" class="dot disconnected"></span>
                    <span id="match-id-display">Not in Match</span>
                </div>
            </div>
            <div class="header-actions">
                <input type="text" id="join-match-id" placeholder="Match ID" class="glass-input-sm">
                <button class="glass-btn" id="btn-watch">Watch Match</button>
                <button class="glass-btn" id="btn-join">Join Match</button>
                <button class="glass-btn primary-btn" id="btn-host">Host New Match</button>
            </div>
        </header>

        <!-- Main Workspace -->
        <div class="workspace">
            
            <!-- Game Area -->
            <main class="game-area">
                
                <!-- Player Status Cards -->
                <div class="players-container">
                    <div class="glass-panel player-card active-turn">
                        <div class="player-symbol symbol-x">X</div>
                        <div class="player-info">
                            <h3>Player 1</h3>
                            <p>Human</p>
                        </div>
                    </div>
                    
                    <div class="glass-panel player-card">
                        <div class="player-symbol symbol-o">O</div>
                        <div class="player-info">
                            <h3>AgentBot</h3>
                            <p>gemini-3.5-flash</p>
                        </div>
                    </div>
                </div>

                <!-- Tic-Tac-Toe Board -->
                <div class="board-wrapper glass-panel">
                    <div class="tic-tac-toe-board" id="board">
                        <!-- 9 Cells -->
                        <div class="cell" data-index="0"></div>
                        <div class="cell" data-index="1"></div>
                        <div class="cell" data-index="2"></div>
                        <div class="cell" data-index="3"></div>
                        <div class="cell" data-index="4"></div>
                        <div class="cell" data-index="5"></div>
                        <div class="cell" data-index="6"></div>
                        <div class="cell" data-index="7"></div>
                        <div class="cell" data-index="8"></div>
                    </div>
                </div>
            </main>

            <!-- Sidebar / Chat Area -->
            <aside class="sidebar glass-panel">
                <header class="chat-header">
                    <h2>Match Log</h2>
                </header>
                
                <div class="chat-messages" id="chat-messages">
                </div>
                
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Type a message..." class="glass-input" disabled>
                    <button id="btn-send-chat" class="glass-btn" disabled>Send</button>
                </div>
            </aside>

        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
