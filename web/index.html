<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Arena - Tic-Tac-Toe</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Main Game Panel -->
        <main class="game-panel glass-panel">
            <header class="header">
                <div class="title-group">
                    <h1>Agent Arena 🤖</h1>
                    <span class="subtitle">Tic-Tac-Toe</span>
                </div>
                <div class="status-group">
                    <div class="server-status">
                        <span class="status-dot disconnected" id="connection-dot"></span>
                        <span class="status-text" id="status-text">Disconnected</span>
                    </div>
                    <div class="match-info">
                        Match ID: <span id="match-id-display">None</span>
                    </div>
                </div>
            </header>

            <div class="lobby-controls">
                <button class="btn btn-primary" id="hostBtn">Host New Match</button>
                <button class="btn btn-secondary" id="joinBtn">Join Match</button>
            </div>

            <div class="board-container">
                <div class="board" id="board">
                    <!-- 9 Grid Cells -->
                    <div class="cell disabled" id="cell-0"></div>
                    <div class="cell disabled" id="cell-1"></div>
                    <div class="cell disabled" id="cell-2"></div>
                    <div class="cell disabled" id="cell-3"></div>
                    <div class="cell disabled" id="cell-4"></div>
                    <div class="cell disabled" id="cell-5"></div>
                    <div class="cell disabled" id="cell-6"></div>
                    <div class="cell disabled" id="cell-7"></div>
                    <div class="cell disabled" id="cell-8"></div>
                </div>
            </div>

            <!-- Player Status Cards -->
            <div class="player-cards">
                <div class="player-card human-card" id="card-x">
                    <div class="symbol">X</div>
                    <div class="name">Player 1</div>
                </div>
                <div class="player-card agent-card" id="card-o">
                    <div class="symbol">O</div>
                    <div class="name">Agent</div>
                </div>
            </div>
        </main>

        <!-- Chat Sidebar Panel -->
        <aside class="chat-panel glass-panel">
            <div class="chat-header">
                <h2>Match Chat</h2>
            </div>
            
            <div class="message-ledger" id="log">
                <!-- Example messages to test styling -->
                <div class="msg system">Waiting for match to begin...</div>
                <!-- <div class="msg user">
                    <span class="sender">Player 1:</span> Let's play!
                </div>
                <div class="msg agent">
                    <span class="sender">Agent:</span> Prepare to lose, fleshbag.
                </div> -->
            </div>

            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Type a message..." disabled>
                <button class="btn btn-send" id="sendBtn" disabled>Send</button>
            </div>
        </aside>
    </div>

    <!-- JS will be added in v04.02 -->
</body>
</html>
