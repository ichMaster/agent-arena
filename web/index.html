<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent·Arena</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app">
    <!-- App bar (web_ui_spec §3) -->
    <header class="appbar glass">
      <div class="brand">Agent<span class="spark">·</span>Arena <small>tic-tac-toe</small></div>
      <div class="status">
        <span class="dot" id="status-dot" data-state="disconnected"></span>
        <span id="status-label">Disconnected</span>
        <span class="match-id" id="match-id" title=""></span>
      </div>
      <nav class="lobby">
        <button class="btn primary" id="btn-host">Host</button>
        <button class="btn" id="btn-join">Join</button>
        <button class="btn" id="btn-observe">Observe</button>
      </nav>
    </header>

    <main class="arena">
      <!-- Stage: board + player cards -->
      <section class="stage glass">
        <div class="turn-banner" id="turn-banner">Not connected</div>
        <div class="board" id="board">
          <button class="cell empty" id="cell-0" disabled></button>
          <button class="cell empty" id="cell-1" disabled></button>
          <button class="cell empty" id="cell-2" disabled></button>
          <button class="cell empty" id="cell-3" disabled></button>
          <button class="cell empty" id="cell-4" disabled></button>
          <button class="cell empty" id="cell-5" disabled></button>
          <button class="cell empty" id="cell-6" disabled></button>
          <button class="cell empty" id="cell-7" disabled></button>
          <button class="cell empty" id="cell-8" disabled></button>
        </div>
        <div class="players" id="players">
          <div class="player-card x" id="card-x">
            <div class="sym x">X</div>
            <div class="player-meta"><span class="name" id="name-x">Player X</span><span class="role" id="role-x">—</span></div>
          </div>
          <div class="player-card o" id="card-o">
            <div class="sym o">O</div>
            <div class="player-meta"><span class="name" id="name-o">Player O</span><span class="role" id="role-o">—</span></div>
          </div>
        </div>
        <p class="legend">Host a match, then run an agent against the match id — or Observe an agent-vs-agent game.</p>
      </section>

      <!-- Chat aside -->
      <aside class="chat glass">
        <div class="chat-header">
          <span>Match Chat</span>
          <span class="count" id="chat-count">0 players · 0 observers</span>
        </div>
        <div class="messages" id="messages"></div>
        <form class="chat-input" id="chat-form">
          <input id="chat-input" type="text" placeholder="Message the room…" autocomplete="off" disabled>
          <button class="btn primary" id="chat-send" type="submit" disabled>Send</button>
        </form>
      </aside>
    </main>
  </div>
</body>
</html>
