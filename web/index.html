<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <header class="glass-panel game-area">
            <div class="header">
                <h1>Agent Arena</h1>
                <div class="status">
                    <span class="status-dot" id="connection-dot"></span>
                    <span id="connection-text">Disconnected</span>
                    <span id="match-id-display"></span>
                </div>
            </div>

            <main class="board" id="board">
                <div class="cell disabled" id="cell-0" data-cell="0"></div>
                <div class="cell disabled" id="cell-1" data-cell="1"></div>
                <div class="cell disabled" id="cell-2" data-cell="2"></div>
                <div class="cell disabled" id="cell-3" data-cell="3"></div>
                <div class="cell disabled" id="cell-4" data-cell="4"></div>
                <div class="cell disabled" id="cell-5" data-cell="5"></div>
                <div class="cell disabled" id="cell-6" data-cell="6"></div>
                <div class="cell disabled" id="cell-7" data-cell="7"></div>
                <div class="cell disabled" id="cell-8" data-cell="8"></div>
            </main>

            <div class="players">
                <div class="player-card" id="player-card-human">
                    <span class="player-symbol player-symbol-x">X</span>
                    <span>You (Human)</span>
                </div>
                <div class="player-card" id="player-card-agent">
                    <span class="player-symbol player-symbol-o">O</span>
                    <span id="agent-name">Agent</span>
                </div>
            </div>

            <div class="lobby-controls" id="lobby-controls">
                <button id="host-match-btn" type="button">Host New Match</button>
                <button id="join-match-btn" type="button">Join Match</button>
            </div>
        </header>

        <aside class="glass-panel chat-area">
            <div class="chat-header">
                Match Chat
                <span id="participant-count"></span>
            </div>

            <div class="messages" id="log"></div>

            <form class="chat-input" id="chat-form">
                <input type="text" id="chat-input" placeholder="Message the room…" autocomplete="off" disabled>
                <button id="sendBtn" type="submit" disabled>Send</button>
            </form>
        </aside>
    </div>

    <script src="app.js"></script>
</body>
</html>
