<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Arena - Chat Test</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .log { background: #0f172a; padding: 1rem; border-radius: 8px; height: 300px; overflow-y: auto; font-family: monospace; margin-bottom: 1rem; }
        input, button { padding: 0.5rem 1rem; border-radius: 6px; border: none; font-size: 1rem; }
        input { background: #334155; color: white; width: 70%; margin-right: 10px; }
        button { background: #3b82f6; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #2563eb; }
        .msg { margin-bottom: 0.5rem; }
        .sender { color: #60a5fa; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Agent Arena 🤖 - Chat Test</h2>
        <div style="margin-bottom: 1rem;">
            <button id="connectBtn" onclick="startTest()">Connect to Match</button>
        </div>
        <div class="log" id="log"></div>
        <div style="display: flex;">
            <input type="text" id="msgInput" placeholder="Type a message..." disabled onkeypress="if(event.key === 'Enter') sendMessage()">
            <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
        </div>
    </div>

    <script>
        let ws;
        let matchId;
        const logEl = document.getElementById('log');

        function log(msg, sender="System") {
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerHTML = `<span class="sender">${sender}:</span> ${msg}`;
            logEl.appendChild(div);
            logEl.scrollTop = logEl.scrollHeight;
        }

        async function startTest() {
            try {
                // 1. Create Match
                log("Creating new match...");
                const matchResp = await fetch("http://localhost:8000/api/v1/lobby/match", { method: "POST" });
                const matchData = await matchResp.json();
                matchId = matchData.match_id;
                log(`Match created: ${matchId}`);

                // 2. Join Match (Get Token)
                const joinResp = await fetch("http://localhost:8000/api/v1/lobby/join", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ match_id: matchId, player_name: "Human" })
                });
                const joinData = await joinResp.json();
                const token = joinData.token;
                log(`Joined lobby. Got WS token.`);

                // 3. Connect WebSocket
                log("Connecting WebSocket...");
                ws = new WebSocket(`ws://localhost:8000/ws/match/${matchId}?token=${token}`);
                
                ws.onopen = () => {
                    log("WebSocket Connected! 🟢");
                    document.getElementById('msgInput').disabled = false;
                    document.getElementById('sendBtn').disabled = false;
                    document.getElementById('connectBtn').disabled = true;
                };

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.event === "chat_message") {
                        log(data.data.message, data.data.sender);
                    }
                };

                ws.onclose = () => log("WebSocket Disconnected 🔴");

            } catch (err) {
                log(`Error: ${err.message}`);
            }
        }

        function sendMessage() {
            const input = document.getElementById('msgInput');
            if (!input.value || !ws) return;
            
            const payload = {
                action: "chat_message",
                payload: {
                    sender: "Human Player",
                    message: input.value
                }
            };
            
            ws.send(JSON.stringify(payload));
            input.value = "";
        }
    </script>
</body>
</html>
